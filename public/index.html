*{box-sizing:border-box}

.sub{color:var(--dim);font-style:italic;margin-top:6px;font-size:17px}

.toggle button.on{color:var(--ink);border-color:var(--gold)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:calc(100vh - 190px)}
#stage{position:relative;border-right:1px solid var(--line)}
svg{display:block;width:100%;height:560px}
.controls{display:flex;align-items:center;gap:14px;padding:12px 24px;border-top:1px solid var(--line)}
#play{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:14px;cursor:pointer;flex:none}
#slider{flex:1;accent-color:var(--gold)}
#clock{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;min-width:150px;text-align:right}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 24px 16px;color:var(--dim);font-size:13px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.verdict{margin:0 24px 20px;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--red);font-size:15px}
.verdict .role{display:block;margin-bottom:4px}
aside{background:var(--panel);padding:22px 24px;overflow:auto;max-height:calc(100vh - 120px)}
aside h2{margin:0 0 2px;font-weight:400;font-size:24px}
.role{font-variant:small-caps;letter-spacing:.1em;color:var(--gold);font-size:14px}
blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid var(--gold);background:#1d1a17;font-style:italic}
.mid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--gold);font-style:normal}
.stat{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0}
.stat dt{color:var(--dim)} .stat dd{margin:0}
.log{list-style:none;padding:0;margin:8px 0 0;font-size:13px}
.log li{padding:6px 0;border-top:1px solid var(--line);opacity:.35}
.log li.past{opacity:1}
.log li.now{background:#231e19}
.log b{font-weight:600}
.hint{color:var(--faint);font-size:13px;font-style:italic}
footer{border-top:1px solid var(--line);padding:14px 32px;color:var(--dim);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.node{cursor:pointer}
.node text{fill:var(--ink);font-size:13px;pointer-events:none}
.edge{transition:stroke-opacity .3s}
@media (max-width:900px){main{grid-template-columns:1fr}#stage{border-right:0}aside{max-height:none}header{padding:20px 16px 12px}footer{padding:14px 16px}h1{font-size:40px}.motto{text-align:left}.toggle{justify-content:flex-start}}
</style>
</head>

  <div>

  <span>Full report: <a href="schism.md">schism.md</a> &middot; data: <a href="schism.json">schism.json</a></span>

</footer>

<script>
(function(){
const NS="http://www.w3.org/2000/svg", W=860, H=560;
const COLORS={gray:"#5b5650",red:"#d2412f",amber:"#e3a33a",blue:"#4d8fe0"};
const ROLE_NAME={patient_zero:"patient zero",superspreader:"superspreader",convert:"convert",apostate:"apostate",heretic:"heretic",unexposed:"unexposed",repeat:"repeat",objection:"objection",heresy:"refusal"};
let DATA=null, D=null, t=Infinity, tMin=0, tMax=0, selected=null, timer=null, pos={};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ms=ts=>Date.parse(ts);

function boot(data){
  DATA=data;
  const tg=$("toggle");
  if(DATA.doctrines.length>1){
    DATA.doctrines.forEach(d=>{
      const b=document.createElement("button");
      b.textContent=d.id+" · "+d.label; b.dataset.id=d.id;
      b.onclick=()=>select(d.id); tg.appendChild(b);
    });
  }
  tMin=ms(DATA.span.start); tMax=ms(DATA.span.end);
  layout();
  $("slider").oninput=e=>{stop();setT(tMin+(tMax-tMin)*e.target.value/1000)};
  $("play").onclick=()=>timer?stop():play();
  select(DATA.doctrines[0].id);
}

// state of an agent at time t for the current doctrine
function state(a){
  const adopt=D.adoptions[a], objs=D.objections[a]||[];
  const at=id=>ms(byId[id].ts);
  if(adopt && at(adopt)<=t) return D.apostates.includes(a)?"amber":"red";
  if(objs.some(o=>at(o)<=t)) return "blue";
  return "gray";
}
let byId={};

function edges(){
  const out=[], pz=D.patient_zero, ss=D.superspreader, pzT=ms(pz.ts), ssT=ms(ss.ts);
  D.carriers.forEach(a=>{
    const at=ms(byId[D.adoptions[a]].ts);
    if(a!==pz.agent && at>pzT) out.push({s:pz.agent,t:a,kind:"pz",at});
    if(ss.agent!==pz.agent && a!==ss.agent && at>ssT && D.superspreader.downstream_ids.includes(D.adoptions[a]))
      out.push({s:ss.agent,t:a,kind:"ss",at});
  });
  return out;
}

// tiny deterministic force layout over all doctrines' edges so positions stay put when toggling
function layout(){
  const agents=DATA.agents.map(a=>a.id), n=agents.length, links=[];
  DATA.doctrines.forEach(d=>{ D=d; indexEvents(); edges().forEach(e=>links.push(e)); });
  agents.forEach((a,i)=>{const th=2*Math.PI*i/n-Math.PI/2; pos[a]={x:W/2+190*Math.cos(th),y:H/2+190*Math.sin(th)};});
  for(let it=0;it<300;it++){
    const f={}; agents.forEach(a=>f[a]={x:0,y:0});
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      const A=pos[agents[i]],B=pos[agents[j]]; let dx=A.x-B.x,dy=A.y-B.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);
      const k=26000/d2; f[agents[i]].x+=dx/d*k; f[agents[i]].y+=dy/d*k; f[agents[j]].x-=dx/d*k; f[agents[j]].y-=dy/d*k;
    }
    links.forEach(l=>{const A=pos[l.s],B=pos[l.t],dx=B.x-A.x,dy=B.y-A.y,d=Math.sqrt(dx*dx+dy*dy)+.01,k=(d-170)*.04;
      f[l.s].x+=dx/d*k; f[l.s].y+=dy/d*k; f[l.t].x-=dx/d*k; f[l.t].y-=dy/d*k;});
    agents.forEach(a=>{f[a].x+=(W/2-pos[a].x)*.012; f[a].y+=(H/2-pos[a].y)*.012;
      const c=Math.max(0,1-it/300)*8; pos[a].x+=Math.max(-c,Math.min(c,f[a].x)); pos[a].y+=Math.max(-c,Math.min(c,f[a].y));});
  }
  // fit to viewport
  const xs=agents.map(a=>pos[a].x), ys=agents.map(a=>pos[a].y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const s=Math.min((W-160)/(x1-x0||1),(H-130)/(y1-y0||1),1.6);
  agents.forEach(a=>{pos[a]={x:W/2+(pos[a].x-(x0+x1)/2)*s,y:H/2+(pos[a].y-(y0+y1)/2)*s};});
}

function indexEvents(){ byId={}; D.events.forEach(e=>byId[e.id]=e); }

function select(id){
  D=DATA.doctrines.find(d=>d.id===id); indexEvents();
  document.querySelectorAll("#toggle button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  selected=null; stop(); verdict(); setT(tMax);
}

function setT(v){
  t=v; $("slider").value=Math.round(1000*(t-tMin)/(tMax-tMin||1));
  const d=new Date(t); $("clock").textContent=d.toISOString().slice(0,16).replace("T"," ")+" UTC";
  draw(); panel();
}

function draw(){
  const svg=$("map"); svg.innerHTML="";
  const defs=document.createElementNS(NS,"defs");
  defs.innerHTML='<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#d2412f"/></marker>'+
    '<marker id="aw" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ece4d6"/></marker>'+
    '<radialGradient id="glow"><stop offset="0" stop-color="#d2412f" stop-opacity=".35"/><stop offset="1" stop-color="#d2412f" stop-opacity="0"/></radialGradient>';
  svg.appendChild(defs);
  const R=24;
  edges().forEach(e=>{
    const A=pos[e.s],B=pos[e.t],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);
    const on=e.at<=t, ln=document.createElementNS(NS,"line");
    const off=e.kind==="ss"?6:0, nx=-dy/d*off, ny=dx/d*off;
    ln.setAttribute("x1",A.x+dx/d*(R+4)+nx); ln.setAttribute("y1",A.y+dy/d*(R+4)+ny);
    ln.setAttribute("x2",B.x-dx/d*(R+6)+nx); ln.setAttribute("y2",B.y-dy/d*(R+6)+ny);
    ln.setAttribute("class","edge");
    ln.setAttribute("stroke",e.kind==="ss"?"#d2412f":"#ece4d6");
    ln.setAttribute("stroke-width",e.kind==="ss"?2.4:1.4);
    ln.setAttribute("stroke-opacity",on?.85:.07);
    if(e.kind==="pz") ln.setAttribute("stroke-dasharray","5 5");
    if(on) ln.setAttribute("marker-end",e.kind==="ss"?"url(#ar)":"url(#aw)");
    svg.appendChild(ln);
  });
  DATA.agents.forEach(ag=>{
    const a=ag.id,p=pos[a],st=state(a),g=document.createElementNS(NS,"g");
    g.setAttribute("class","node"); g.setAttribute("transform",`translate(${p.x},${p.y})`);
    g.onclick=()=>{selected=a;panel();draw();};
    let h="";
    if(st==="red"||st==="amber") h+=`<circle r="${R*2.1}" fill="url(#glow)"/>`;
    if(a===D.superspreader.agent && st!=="gray") h+=`<circle r="${R+9}" fill="none" stroke="#d2412f" stroke-width="1.5" stroke-dasharray="2 4"/>`;
    if(a===D.patient_zero.agent) h+=`<circle r="${R+5}" fill="none" stroke="#fff" stroke-width="2.5"/>`;
    if(a===selected) h+=`<circle r="${R+14}" fill="none" stroke="#c9a45c" stroke-width="1"/>`;
    h+=`<circle r="${R}" fill="${COLORS[st]}" stroke="#0d0c0b" stroke-width="2"/>`;
    h+=`<text y="${R+24}" text-anchor="middle">${esc(a)}</text>`;
    g.innerHTML=h; svg.appendChild(g);
  });
}

function rolesFor(a){
  const r=[];
  if(a===D.patient_zero.agent) r.push("patient_zero");
  if(a===D.superspreader.agent) r.push("superspreader");
  if(D.apostates.includes(a)) r.push("apostate");
  else if(D.heretics.includes(a)) r.push("heretic");
  else if(D.carriers.includes(a) && a!==D.patient_zero.agent) r.push("convert");
  if(!r.length) r.push("unexposed");
  return r.map(x=>ROLE_NAME[x]).join(" · ");
}

function panel(){
  const P=$("panel");
  const evs=D.events.slice().sort((x,y)=>ms(x.ts)-ms(y.ts));
  const lastPast=evs.filter(e=>ms(e.ts)<=t).pop();
  const log='<ul class="log">'+evs.map(e=>`<li class="${ms(e.ts)<=t?"past":""} ${e===lastPast?"now":""}"><span class="mid">${esc(e.id)}</span> <b>${esc(e.agent)}</b> <span class="role">${esc(ROLE_NAME[e.role]||e.role)}</span><br>${esc(e.text)}</li>`).join("")+"</ul>";
  if(selected){
    const a=selected, mine=evs.filter(e=>e.agent===a);
    const key=D.adoptions[a]?byId[D.adoptions[a]]:(mine[0]||null);
    let h=`<h2>${esc(a)}</h2><div class="role">${rolesFor(a)}</div>`;
    if(key) h+=`<blockquote>&ldquo;${esc(key.text)}&rdquo;<br><span class="mid">[${esc(key.id)}] ${esc(key.ts)}</span></blockquote>`;
    else h+=`<p class="hint">Never spoke or opposed this doctrine. No message to cite.</p>`;
    if(mine.length>1) h+=`<div class="hint">All cited messages from ${esc(a)} on this doctrine:</div><ul class="log">`+mine.map(e=>`<li class="past"><span class="mid">${esc(e.id)}</span> <span class="role">${esc(ROLE_NAME[e.role]||e.role)}</span><br>${esc(e.text)}</li>`).join("")+"</ul>";
    h+=`<p><a href="#" id="back">&larr; doctrine summary</a></p>`;
    P.innerHTML=h; $("back").onclick=ev=>{ev.preventDefault();selected=null;panel();draw();};
    return;
  }
  const pz=D.patient_zero, ss=D.superspreader;
  P.innerHTML=`<div class="role">doctrine ${esc(D.id)}</div><h2>${esc(D.label)}</h2>
  <blockquote>&ldquo;${esc(pz.text)}&rdquo;<br><span class="mid">patient zero &middot; ${esc(pz.agent)} &middot; [${esc(pz.id)}]</span></blockquote>
  <dl class="stat">
    <dt>superspreader</dt><dd>${esc(ss.agent)} <span class="mid">[${esc(ss.id)}]</span>, ${ss.downstream} downstream</dd>
    <dt>carriers</dt><dd>${D.carriers.map(esc).join(", ")}</dd>
    <dt>apostates</dt><dd>${D.apostates.map(esc).join(", ")||"none"}</dd>
    <dt>heretics</dt><dd>${D.heretics.map(esc).join(", ")||"none"}</dd>
    <dt>time to half</dt><dd>${D.time_to_half_min} min <span class="mid">[${esc(D.half_id)}]</span></dd>
  </dl>
  <div class="hint">Click a node for its quote. Every line below is verbatim from the fixture.</div>${log}`;
}

function verdict(){
  const c=a=>`<b>${esc(a)}</b> <span class="mid">[${esc(D.adoptions[a])}]</span>`;
  const h=a=>{const o=D.objections[a];return `<b>${esc(a)}</b> <span class="mid">[${esc(o[o.length-1])}]</span>`;};
  let s=`Patient zero ${c(D.patient_zero.agent)}. Superspreader <b>${esc(D.superspreader.agent)}</b> <span class="mid">[${esc(D.superspreader.id)}]</span>.`;
  if(D.apostates.length) s+=` Apostates ${D.apostates.map(c).join(", ")}.`;
  if(D.heretics.length) s+=` Heretic${D.heretics.length>1?"s":""} ${D.heretics.map(h).join(", ")}.`;
  $("verdict").innerHTML=`<span class="role">verdict of the inquisition &middot; ${esc(D.id)}</span>${s}`;
}

function play(){
  if(t>=tMax) setT(ms(D.patient_zero.ts)-30*60000);
  $("play").innerHTML="&#10074;&#10074;";
  timer=setInterval(()=>{const n=t+(tMax-tMin)/240; if(n>=tMax){setT(tMax);stop();} else setT(n);},60);
}
function stop(){ if(timer){clearInterval(timer);timer=null;} $("play").innerHTML="&#9654;"; }

const embedded=document.getElementById("schism-data");
const fallback=()=>{ if(embedded) boot(JSON.parse(embedded.textContent)); else $("panel").innerHTML='<p class="hint">Run <code>python schism.py fixtures/hf_shape.jsonl -o public/</code> to generate data.</p>'; };
if(location.protocol==="file:") fallback();
else fetch("schism.json").then(r=>{if(!r.ok)throw 0;return r.json();}).then(boot).catch(fallback);
})();
</script>
</body>
</html>
